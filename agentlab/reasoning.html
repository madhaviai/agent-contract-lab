<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Document Assistant</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#edf4fa;font:16px/1.5 system-ui,sans-serif}
main{max-width:820px;height:100dvh;margin:auto;padding:20px;display:flex;flex-direction:column}
header{padding:10px 0 16px;border-bottom:1px solid #3d5068}h1{font-size:22px;margin:0}
.subtitle,.small{font-size:13px;color:#b9c9da}.subtitle{margin:3px 0 0}
#messages{flex:1;overflow:auto;padding:16px 2px;display:flex;flex-direction:column;gap:12px}
.message{max-width:min(88%,650px);padding:11px 14px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.assistant{align-self:flex-start;background:#192c42}.user{align-self:flex-end;background:#24475b}
.message p{margin:0}
.settings{display:flex;gap:12px;padding:12px 0 0;border-top:1px solid #3d5068}
label{display:flex;align-items:center;gap:8px;color:#b9c9da;font-size:13px}
select{padding:8px;background:#19283d;color:white;border:1px solid #6c809b;border-radius:8px;font:inherit}
.composer{display:flex;gap:10px;padding-top:10px}
textarea{flex:1;resize:vertical;min-height:48px;max-height:140px;padding:12px;background:#19283d;color:white;border:1px solid #6c809b;border-radius:8px;font:inherit}
button{padding:10px 18px;background:#24475b;color:white;border:1px solid #76bba9;border-radius:8px;font:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}#status{min-height:20px;color:#efc57c;font-size:13px}
@media(max-width:600px){main{padding:12px}.settings{flex-wrap:wrap}.composer{align-items:stretch}button{padding:8px 12px}}
</style></head><body><main>
<header><h1>Document Assistant</h1><p class="subtitle">Ask a question about the support documents.</p></header>
<section id="messages" role="log" aria-live="polite">
  <div class="message assistant"><p>Welcome! I can help answer questions from the support documents. What would you like to know?</p></div>
</section>
<div id="status" role="status" aria-live="polite"></div>
<div class="settings">
  <label for="model">Model
    <select id="model" aria-label="Selected model">
      <option value="claude-sonnet-4-5">Claude Sonnet 4.5</option>
      <option value="grok-3">Grok 3</option>
    </select>
  </label>
  <label for="effort">Reasoning effort
    <select id="effort" aria-label="Reasoning effort">
      <option value="low">Low</option>
      <option value="high" selected>High</option>
    </select>
  </label>
</div>
<form id="composer" class="composer">
  <textarea id="question" maxlength="400" rows="2" placeholder="Ask a question…" aria-label="Your question" required></textarea>
  <button id="send" type="submit">Send</button>
</form>
</main><script id="config" type="application/json">__CONFIG__</script><script>
const cfg=JSON.parse(document.getElementById('config').textContent), $=id=>document.getElementById(id);
function addMessage(role,text){
  const article=document.createElement('article');
  article.className='message '+role;
  const body=document.createElement('p');
  body.textContent=text;
  article.append(body);
  $('messages').append(article);
  $('messages').scrollTop=$('messages').scrollHeight;
}
$('composer').addEventListener('submit',async event=>{
  event.preventDefault();
  const question=$('question').value.trim();
  if(!question)return;
  $('send').disabled=true;
  $('question').disabled=true;
  addMessage('user',question);
  $('question').value='';
  $('status').textContent='Searching the support documents…';
  try{
    const response=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json','X-Demo-Token':cfg.csrf},body:JSON.stringify({
      question,
      selected_model:$('model').value,
      requested_reasoning_effort:$('effort').value
    })});
    const data=await response.json();
    if(!response.ok)throw new Error(data.error||'Unable to answer this question.');
    addMessage('assistant',data.answer);
    $('status').textContent='Answered from the support documents.';
  }catch(error){
    addMessage('assistant','Sorry, I could not answer that right now. '+error.message);
    $('status').textContent='Request failed.';
  }finally{
    $('send').disabled=false;
    $('question').disabled=false;
    $('question').focus();
  }
});
</script></body></html>
